- name: Configure K3s Server & Fetch/Merge Kubectl Config
  hosts: k3s-server
  become: true
  vars:
    flannel_backend_none: true
    disable_network_policy: true
    disable_traefik: true
    disable_servicelb: true
    disable_embedded_registry: true
  roles:
    - role: homelab.k3s.base
    - role: homelab.k3s.fetch_config