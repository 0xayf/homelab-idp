# Example: Set a Gitea Actions secret programmatically. Three scopes are
# supported - org, repo, user - selected via spec.scope.type. The value
# comes from an in-namespace Kubernetes secret (use an ExternalSecret in
# front if you want a Vault-backed source).
#
# Note: the PAT XR's spec.actionsSecrets field composes this XR for you
# when distributing a freshly-minted PAT, so you only apply this claim
# directly when the value isn't a PAT (e.g. a webhook signing key, an
# external API token).
#
# This file is self-contained: it includes placeholder source secrets
# alongside the claims so the manifest can be applied as-is.
---
# Source secret for the org-scoped example
apiVersion: v1
kind: Secret
metadata:
  name: shared-deploy-key-source
  namespace: crossplane-examples
type: Opaque
stringData:
  token: replace-with-your-org-deploy-key-value
---
# Org-scoped: visible to workflows in any repo under the org.
apiVersion: registry.local.lab/v1alpha1
kind: ActionsSecret
metadata:
  name: shared-deploy-key-apps
  namespace: crossplane-examples
spec:
  secretName: SHARED_DEPLOY_KEY
  scope:
    type: org
    org: apps
  secretValueSecretRef:
    name: shared-deploy-key-source
    key: token
---
# Source secret for the repo-scoped example
apiVersion: v1
kind: Secret
metadata:
  name: webhook-signing-key-source
  namespace: crossplane-examples
type: Opaque
stringData:
  token: replace-with-your-webhook-signing-key
---
# Repo-scoped: visible only to workflows in that one repo.
apiVersion: registry.local.lab/v1alpha1
kind: ActionsSecret
metadata:
  name: hermes-agent-webhook-secret
  namespace: crossplane-examples
spec:
  secretName: WEBHOOK_SIGNING_KEY
  scope:
    type: repo
    repo:
      owner: apps
      name: hermes-agent
  secretValueSecretRef:
    name: webhook-signing-key-source
    key: token
---
# Source secret for the user-scoped example
apiVersion: v1
kind: Secret
metadata:
  name: self-token-source
  namespace: crossplane-examples
type: Opaque
stringData:
  token: replace-with-your-user-scoped-secret
---
# User-scoped: visible to workflows in repos owned by the referenced user.
# The composition builds a per-claim ProviderConfig from the User XR's
# credentials secret, since /user/actions/secrets operates on the
# authenticated user.
apiVersion: registry.local.lab/v1alpha1
kind: ActionsSecret
metadata:
  name: svc-ci-bot-self-token
  namespace: crossplane-examples
spec:
  secretName: SELF_TOKEN
  scope:
    type: user
    userRef:
      name: svc-ci-bot
  secretValueSecretRef:
    name: self-token-source
    key: token
