apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: pats.registry.local.lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    crossplane.io/xrd: pats.registry.local.lab
spec:
  compositeTypeRef:
    apiVersion: registry.local.lab/v1alpha1
    kind: PAT
  mode: Pipeline
  pipeline:
    - step: create-pat
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := getCompositeResource . -}}
            {{- $name := $xr.metadata.name -}}
            {{- $namespace := $xr.metadata.namespace -}}
            {{- $userRefName := $xr.spec.userRef.name -}}
            {{- $tokenName := default $name $xr.spec.tokenName -}}
            {{- $scopes := default (list) $xr.spec.scopes -}}
            {{- $endpoint := default "https://git.local.lab" $xr.spec.endpoint -}}
            {{- $vaultPath := printf "platform/%s/kv/%s" $namespace $name -}}
            {{- $secretStoreName := printf "%s-secret-store" $namespace -}}
            {{- $providerConfigName := printf "%s-pc" $name -}}
            {{- $kubernetesSecretEnabled := $xr | dig "spec" "kubernetesSecret" "enabled" false -}}
            {{- $kubernetesSecretName := default $name ($xr | dig "spec" "kubernetesSecret" "name" "") -}}
            {{- $kubernetesSecretKey := default "token" ($xr | dig "spec" "kubernetesSecret" "key" "token") -}}
            ---
            # Per-PAT ProviderConfig that authenticates as the referenced User.
            # The User XR's composition materialises an in-namespace secret with
            # a `credentials` key containing {"username":..., "password":...}.
            apiVersion: gitea.m.crossplane.io/v1beta1
            kind: ProviderConfig
            metadata:
              name: {{ $providerConfigName }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: provider-config
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              endpoint: {{ $endpoint | quote }}
              credentials:
                source: Secret
                secretRef:
                  namespace: {{ $namespace }}
                  name: {{ $userRefName }}
                  key: credentials
            ---
            # The Token MR — creates a PAT under the user authenticated by the
            # ProviderConfig above. The raw token is written to the connection
            # secret <name>-token-raw under key `token`.
            apiVersion: gitea.gitea.m.crossplane.io/v1alpha1
            kind: Token
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: token
            spec:
              forProvider:
                name: {{ $tokenName }}
                scopes:
            {{- range $scope := $scopes }}
                  - {{ $scope | quote }}
            {{- end }}
              writeConnectionSecretToRef:
                name: {{ $name }}-token-raw
              providerConfigRef:
                kind: ProviderConfig
                name: {{ $providerConfigName }}
            ---
            # Push the raw token to Vault at platform/<ns>/kv/<name>.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: push-secret
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ $name }}
                    namespace: {{ $namespace }}
                  spec:
                    updatePolicy: Replace
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - kind: SecretStore
                        name: {{ $secretStoreName }}
                    selector:
                      secret:
                        name: {{ $name }}-token-raw
                    data:
                      - match:
                          remoteRef:
                            remoteKey: {{ $name }}
                            property: token
                          secretKey: attribute.token
              readiness:
                policy: DeriveFromObject
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes-config
              references:
                - dependsOn:
                    apiVersion: v1
                    kind: Secret
                    namespace: {{ $namespace }}
                    name: {{ $name }}-token-raw
            {{- range $i, $entry := default (list) $xr.spec.actionsSecrets }}
            ---
            # Distribute the PAT to a Gitea Actions secret. The composition
            # of the ActionsSecret XR handles the per-scope provider MR.
            apiVersion: registry.local.lab/v1alpha1
            kind: ActionsSecret
            metadata:
              name: {{ printf "%s-as-%d" $name $i }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ printf "actions-secret-%d" $i }}
            spec:
              secretName: {{ $entry.secretName | quote }}
              scope:
                type: {{ $entry.scope.type }}
                {{- if eq $entry.scope.type "org" }}
                org: {{ $entry.scope.org | quote }}
                {{- else if eq $entry.scope.type "repo" }}
                repo:
                  owner: {{ $entry.scope.repo.owner | quote }}
                  name: {{ $entry.scope.repo.name | quote }}
                {{- else if eq $entry.scope.type "user" }}
                userRef:
                  {{- $userRefName := $xr.spec.userRef.name -}}
                  {{- if and $entry.scope.userRef $entry.scope.userRef.name }}
                  name: {{ $entry.scope.userRef.name | quote }}
                  {{- else }}
                  name: {{ $userRefName | quote }}
                  {{- end }}
                {{- end }}
              secretValueSecretRef:
                # The PAT's connection secret carries the raw token under the
                # upjet-conventional `attribute.token` key.
                name: {{ printf "%s-token-raw" $name }}
                key: attribute.token
            {{- end }}
            {{- if $kubernetesSecretEnabled }}
            ---
            # Optional: materialise an in-namespace K8s secret with the token,
            # sourced from Vault (so Vault remains the source of truth).
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: external-secret
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $name }}
                    namespace: {{ $namespace }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      kind: SecretStore
                      name: {{ $secretStoreName }}
                    target:
                      name: {{ $kubernetesSecretName }}
                      creationPolicy: Owner
                    data:
                      - remoteRef:
                          key: {{ $name }}
                          property: token
                        secretKey: {{ $kubernetesSecretKey }}
              readiness:
                policy: DeriveFromObject
              providerConfigRef:
                kind: ClusterProviderConfig
                name: provider-kubernetes-config
              references:
                - dependsOn:
                    apiVersion: external-secrets.io/v1alpha1
                    kind: PushSecret
                    namespace: {{ $namespace }}
                    name: {{ $name }}
            {{- end }}
            ---
            apiVersion: registry.local.lab/v1alpha1
            kind: PAT
            metadata:
              name: {{ $name }}
            status:
              ready: true
              vaultPath: {{ $vaultPath }}

    - step: auto-ready
      functionRef:
        name: function-auto-ready
