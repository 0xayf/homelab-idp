apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: users.registry.local.lab
spec:
  group: registry.local.lab
  names:
    kind: User
    plural: users
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                username:
                  type: string
                  description: Username in Gitea. Defaults to metadata.name.
                email:
                  type: string
                  description: Email for the user. Defaults to <username>@<namespace>.local.
                fullName:
                  type: string
                  description: Optional display name. Defaults to username.
                passwordLength:
                  type: integer
                  description: Length of the auto-generated password.
                  default: 32
                  minimum: 16
                  maximum: 128
                providerConfigName:
                  type: string
                  description: ClusterProviderConfig name for the Gitea provider.
                  default: gitea-provider-config
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: Whether the user is ready.
                vaultPath:
                  type: string
                  description: Vault path where the password is stored.
                credentialsSecretName:
                  type: string
                  description: Name of the in-namespace K8s secret with username/password fields.
