apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: actionssecrets.registry.local.lab
spec:
  group: registry.local.lab
  names:
    kind: ActionsSecret
    plural: actionssecrets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - secretName
                - scope
                - secretValueSecretRef
              properties:
                secretName:
                  type: string
                  description: |-
                    Name of the Gitea Actions secret as it appears to workflows
                    (i.e. ${{ secrets.<secretName> }}).
                scope:
                  type: object
                  description: |-
                    Where the Actions secret is exposed. Exactly one of org,
                    repo, or user must be set, matching scope.type.
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum: [org, repo, user]
                    org:
                      type: string
                      description: Required when type=org. Gitea organisation name.
                    repo:
                      type: object
                      description: Required when type=repo.
                      properties:
                        owner:
                          type: string
                        name:
                          type: string
                      required:
                        - owner
                        - name
                    userRef:
                      type: object
                      description: |-
                        Required when type=user. References a User XR (in the
                        same namespace) whose credentials are used to
                        authenticate to /user/actions/secrets.
                      properties:
                        name:
                          type: string
                      required:
                        - name
                secretValueSecretRef:
                  type: object
                  description: |-
                    In-namespace Kubernetes secret holding the value to push
                    to Gitea. Use an ExternalSecret to source from Vault if
                    needed.
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                providerConfigName:
                  type: string
                  description: |-
                    ClusterProviderConfig used to authenticate to Gitea for
                    org and repo scopes. Defaults to the platform admin
                    config. Ignored for user scope (a per-claim
                    ProviderConfig is built from the referenced User XR).
                  default: gitea-provider-config
                endpoint:
                  type: string
                  description: |-
                    Gitea base URL set on the per-claim ProviderConfig used
                    for user scope. Defaults to the in-cluster service URL.
                    Ignored for org and repo scopes (the ProviderConfig
                    referenced by providerConfigName carries its own
                    endpoint).
                  default: http://gitea-http.gitea.svc.cluster.local:3000
            status:
              type: object
              properties:
                ready:
                  type: boolean
