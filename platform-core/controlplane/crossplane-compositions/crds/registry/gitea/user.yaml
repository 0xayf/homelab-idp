apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: users.registry.local.lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    crossplane.io/xrd: users.registry.local.lab
spec:
  compositeTypeRef:
    apiVersion: registry.local.lab/v1alpha1
    kind: User
  mode: Pipeline
  pipeline:
    - step: create-user
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := getCompositeResource . -}}
            {{- $name := $xr.metadata.name -}}
            {{- $namespace := $xr.metadata.namespace -}}
            {{- $username := default $name $xr.spec.username -}}
            {{- $email := default (printf "%s@%s.local" $username $namespace) $xr.spec.email -}}
            {{- $fullName := default $username $xr.spec.fullName -}}
            {{- $passwordLength := default 32 $xr.spec.passwordLength -}}
            {{- $providerConfigName := default "gitea-provider-config" $xr.spec.providerConfigName -}}
            {{- $vaultPath := printf "platform/%s/kv/%s" $namespace $name -}}
            ---
            # Generate password, push to Vault, materialise K8s secret with username+password fields.
            apiVersion: secrets.local.lab/v1alpha1
            kind: UserPass
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: userpass
            spec:
              username: {{ $username }}
              length: {{ $passwordLength }}
              # Materialise a `credentials` key holding the JSON shape the
              # Gitea provider expects in its credentials secret. base_url is
              # set on ProviderConfig.spec.endpoint by downstream consumers.
              outputTemplate:
                secretKey: credentials
                template: '{"username":"{{ "{{ .username }}" }}","password":"{{ "{{ .password }}" }}"}'
            ---
            # Create the Gitea user using the password from the UserPass-materialised secret.
            apiVersion: gitea.gitea.m.crossplane.io/v1alpha1
            kind: User
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: gitea-user
            spec:
              forProvider:
                username: {{ $username }}
                loginName: {{ $username }}
                email: {{ $email | quote }}
                fullName: {{ $fullName | quote }}
                passwordSecretRef:
                  name: {{ $name }}
                  key: password
                admin: false
                mustChangePassword: false
                # Gitea's prohibit_login is an account-level gate that blocks
                # all sign-in paths (UI, API, git, registry) regardless of auth
                # method - there is no "API-only" mode. Service users that need
                # to act via PATs must keep this false.
                prohibitLogin: false
                sendNotification: false
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $providerConfigName }}
            ---
            apiVersion: registry.local.lab/v1alpha1
            kind: User
            metadata:
              name: {{ $name }}
            status:
              ready: true
              vaultPath: {{ $vaultPath }}
              credentialsSecretName: {{ $name }}

    - step: auto-ready
      functionRef:
        name: function-auto-ready
