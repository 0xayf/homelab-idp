apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: actionssecrets.registry.local.lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    crossplane.io/xrd: actionssecrets.registry.local.lab
spec:
  compositeTypeRef:
    apiVersion: registry.local.lab/v1alpha1
    kind: ActionsSecret
  mode: Pipeline
  pipeline:
    - step: create-actions-secret
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := getCompositeResource . -}}
            {{- $name := $xr.metadata.name -}}
            {{- $namespace := $xr.metadata.namespace -}}
            {{- $secretName := $xr.spec.secretName -}}
            {{- $scopeType := $xr.spec.scope.type -}}
            {{- $valueRef := $xr.spec.secretValueSecretRef -}}
            {{- $providerConfigName := default "gitea-provider-config" $xr.spec.providerConfigName -}}
            {{- $endpoint := default "http://gitea-http.gitea.svc.cluster.local:3000" $xr.spec.endpoint -}}
            {{- if eq $scopeType "repo" }}
            ---
            # Repo-scoped: PUT /repos/{owner}/{name}/actions/secrets/{name}
            apiVersion: repository.gitea.m.crossplane.io/v1alpha1
            kind: ActionsSecret
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: actions-secret
            spec:
              forProvider:
                repositoryOwner: {{ $xr.spec.scope.repo.owner | quote }}
                repository: {{ $xr.spec.scope.repo.name | quote }}
                secretName: {{ $secretName | quote }}
                secretValueSecretRef:
                  name: {{ $valueRef.name }}
                  key: {{ $valueRef.key }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $providerConfigName }}
            {{- else if eq $scopeType "org" }}
            ---
            # Org-scoped: PUT /orgs/{org}/actions/secrets/{name}
            apiVersion: repository.gitea.m.crossplane.io/v1alpha1
            kind: OrgActionsSecret
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: actions-secret
            spec:
              forProvider:
                org: {{ $xr.spec.scope.org | quote }}
                secretName: {{ $secretName | quote }}
                secretValueSecretRef:
                  name: {{ $valueRef.name }}
                  key: {{ $valueRef.key }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: {{ $providerConfigName }}
            {{- else if eq $scopeType "user" }}
            {{- $userRefName := $xr.spec.scope.userRef.name -}}
            {{- $userPC := printf "%s-pc" $name -}}
            ---
            # User-scoped requires authenticating as the target user (Gitea's
            # /user/actions/secrets endpoint operates on the authenticated
            # user). We build a per-claim ProviderConfig pointing at the
            # referenced User XR's credentials secret.
            apiVersion: gitea.m.crossplane.io/v1beta1
            kind: ProviderConfig
            metadata:
              name: {{ $userPC }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: provider-config
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              endpoint: {{ $endpoint | quote }}
              credentials:
                source: Secret
                secretRef:
                  namespace: {{ $namespace }}
                  name: {{ $userRefName }}
                  key: credentials
            ---
            # PUT /user/actions/secrets/{name}
            apiVersion: repository.gitea.m.crossplane.io/v1alpha1
            kind: UserActionsSecret
            metadata:
              name: {{ $name }}
              namespace: {{ $namespace }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: actions-secret
            spec:
              forProvider:
                secretName: {{ $secretName | quote }}
                secretValueSecretRef:
                  name: {{ $valueRef.name }}
                  key: {{ $valueRef.key }}
              providerConfigRef:
                kind: ProviderConfig
                name: {{ $userPC }}
            {{- end }}
            ---
            apiVersion: registry.local.lab/v1alpha1
            kind: ActionsSecret
            metadata:
              name: {{ $name }}
            status:
              ready: true

    - step: auto-ready
      functionRef:
        name: function-auto-ready
